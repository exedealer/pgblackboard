name: pgblackboard
services:

  pgbb:
    build: .
    ports: ['7890:7890'] # host:container
    read_only: true
    command: [pgbb, 'postgres://postgres:5432']
    # deploy:
    #   resources:
    #     limits:
    #       memory: 10M

  dev:
    build: { context: '.', target: dev }
    ports: ['7890:7890'] # host:container
    tty: true
    volumes: [.:/app]
    command: [cargo, run, --
      , '--verbosity=debug'
      , 'postgres://postgres:5432?application_name=pgbb-dev']
    develop:
      watch:
        - { path: dockerfile, action: rebuild }
        - { path: ./server, action: restart }

  pg18:
    image: kagiskz/postgres:18.1-20251218
    command: [postgres
      , -c, log_connections=all
      , -c, log_disconnections=on]
    networks:
      default:
        aliases:
          - postgres

  pg10:
    image: postgres:10.23-alpine3.16
    environment:
      - POSTGRES_PASSWORD=secret
    networks:
      default:
        aliases:
          - postgres
